[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ov-voice"
version = "0.1.0"
description = "Talk to an OVStreaming session from a browser: speech in, speech out"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "ov-streaming",
  "pipecat-ai[openai,runner,silero,webrtc]>=1.15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ov_voice"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
